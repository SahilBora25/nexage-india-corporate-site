# This config is loaded from /etc/nginx/conf.d inside the http context.
# A trusted HTTPS ingress should overwrite X-Forwarded-Proto before sending traffic here.
map $http_x_forwarded_proto $nexage_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace the caller-supplied chain. Configure Nginx real-IP trust for the
    # actual ingress CIDRs before this hop if the site is behind another proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $nexage_forwarded_proto;
    proxy_read_timeout 65s;
  }
  location = /backend-admin {
    return 301 /backend-admin/;
  }
  location /backend-admin/ {
    # Django Admin has a few inline bootstrapping scripts; relax script-src only on this
    # staff-authenticated path. The public React site keeps the stricter policy above.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    proxy_pass http://backend:8000/backend-admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $nexage_forwarded_proto;
  }
  location ^~ /static/ {
    alias /var/www/django-static/;
    expires 7d;
  }
  location /healthz/ {
    proxy_pass http://backend:8000/healthz/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $nexage_forwarded_proto;
  }
  location ~* \.(?:css|js|webp|png|jpg|jpeg|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
  location = /robots.txt { try_files $uri =404; expires 1h; }
  location = /sitemap.xml { try_files $uri =404; expires 1h; }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
