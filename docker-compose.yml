x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  POSTGRES_DB: ${POSTGRES_DB:-nexage}
  POSTGRES_USER: ${POSTGRES_USER:-nexage}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST to the approved SMTP host in .env}
  EMAIL_PORT: ${EMAIL_PORT:?Set EMAIL_PORT in .env}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:?Set EMAIL_USE_TLS in .env}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:?Set EMAIL_USE_SSL in .env}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in .env}
  SALES_ENQUIRY_EMAIL: ${SALES_ENQUIRY_EMAIL:?Set SALES_ENQUIRY_EMAIL in .env}
  SEND_CUSTOMER_CONFIRMATION: ${SEND_CUSTOMER_CONFIRMATION:-false}
  REDIS_URL: redis://redis:6379/1
  API_ANON_RATE: ${API_ANON_RATE:-100/day}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexage}
      POSTGRES_USER: ${POSTGRES_USER:-nexage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexage} -d ${POSTGRES_DB:-nexage}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment: *backend-environment
    volumes:
      - private_media:/app/backend/private_media
      - django_static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import Request, urlopen; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request=Request('http://127.0.0.1:8000/healthz/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urlopen(request, timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - django_static:/var/www/django-static:ro
    depends_on:
      backend:
        condition: service_healthy

  catalogue-seed:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "manage.py", "seed_catalog"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  private_media:
  django_static:
